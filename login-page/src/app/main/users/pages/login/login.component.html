<div class="container">
    <form [formGroup]="LoginForm" (ngSubmit)="onLogin()">
        <h3>Login</h3>
        <p *ngIf="errorMsg" class="error">{{errorMsg}}</p>
        <mat-form-field>
            <mat-label>Username</mat-label>
            <input
              matInput
              type="email"
              formControlName = "username"
              placeholder="hello@example.com"
              required
            />
              <mat-error *ngIf="username?.hasError('required')">Username is required.</mat-error>
              <mat-error *ngIf="username?.hasError('email')">Username must be an email.</mat-error>
            
          </mat-form-field>
        <mat-form-field>
            <mat-label>Password</mat-label>
            <input
              matInput
              type="password"
              formControlName = "password"
              required
            />
              <mat-error *ngIf="password?.hasError('required')">Password is required.</mat-error>
            
          </mat-form-field>

          <button type="submit" mat-flat-button [disabled]="LoginForm.invalid">Login</button>

    </form>
</div>
